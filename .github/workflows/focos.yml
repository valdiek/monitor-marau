name: Focos de calor (a cada hora)

on:
  schedule:
    # a cada hora, aos 10 min: pega cada passagem polar e o GOES-19 (a cada 10 min)
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      teste_aviso:
        description: "Só enviar uma mensagem de TESTE no WhatsApp/Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e processar focos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/coletar.py
      - name: Qualidade do ar (CAMS)
        run: python scripts/ar.py
      - name: Avisar no WhatsApp / Telegram (focos perto da comunidade)
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_PARA: ${{ secrets.WHATSAPP_PARA }}
          WHATSAPP_MODELO: ${{ vars.WHATSAPP_MODELO }}
          WHATSAPP_IDIOMA: ${{ vars.WHATSAPP_IDIOMA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/avisar.py ${{ inputs.teste_aviso && '--teste' || '' }}
      - name: Publicar dados
        run: |
          git config user.name "monitor-andira-marau[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Focos: atualização $(TZ=America/Manaus date +'%d/%m %Hh')"
          git pull --rebase --autostash
          git push
